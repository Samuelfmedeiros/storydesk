[project]
name = "content-ops"
version = "0.1.0"
description = "Gerenciador, agendador e criador de posts para blogs — narrativo, com memória, curadoria e fallback."
requires-python = ">=3.10"
dependencies = []

[project.scripts]
content-ops = "content_ops.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["content_ops"]

[tool.setuptools.package-data]
content_ops = ["py.typed"]

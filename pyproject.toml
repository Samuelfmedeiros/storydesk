[project]
name = "storydesk"
version = "0.2.0"
description = "Gerenciador, agendador e criador de posts para blogs — narrativo, com memória, curadoria e fallback."
requires-python = ">=3.10"
dependencies = []

[project.scripts]
storydesk = "storydesk.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["storydesk"]

[tool.setuptools.package-data]
storydesk = ["py.typed"]
